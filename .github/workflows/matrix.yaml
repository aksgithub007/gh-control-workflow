name: matrix demo
on:
  push:
    branches:
      - main
jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        node: [12, 14, 16, latest]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - node: 18
            os: ubuntu-latest
        exclude:
          - node: [12, 14]
            os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: setup node js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: install dependencies
        run: npm ci
      - name: build app
        run: npm run build
      - name: display values
        run: |
          echo "OS is ${{ matrix.os }}"
          echo "Node version is ${{ matrix.node }}"
