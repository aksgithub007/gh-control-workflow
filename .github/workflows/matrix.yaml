name: matrix demo
on:
  push:
    branches:
      - main
jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [12, 14, 16, latest]
      include:
        - node: 18
          os: ubuntu-latest
      exclude:
        - node: 12
          os: windows-latest
        - node: 12
          os: macos-latest
        - node: 12
          os: ubuntu-latest
        - node: 14
          os: windows-latest
        - node: 14
          os: macos-latest
        - node: 14
          os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: setup node js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: install dependencies
        run: npm ci
      - name: build app
        run: npm run build
      - name: display values
        run: |
          echo "OS is ${{ matrix.os }}"
          echo "Node version is ${{ matrix.node }}"
